<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>Home</title>
<style>
:root{--bg:#000;--tile:#0c0c0c;--line:#1e1e1e;--muted:#8a8a8a;--ok:#3ddc84;--warn:#ffb020;--bad:#ff4d4d;--gray:#555}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.wm{font-weight:600;letter-spacing:.04em;font-size:22px}.wm .sub{letter-spacing:.1em;color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
#clk{color:var(--muted);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px 20px;max-width:1400px;margin:0 auto}
.t{background:var(--tile);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:140px;transition:transform .08s}
.t:active{transform:scale(.99)}.t.green{border-left-color:var(--ok)}.t.amber{border-left-color:var(--warn)}.t.red{border-left-color:var(--bad)}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.tn{font-weight:600;font-size:17px}
.st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t.green .st{color:var(--ok)}.t.amber .st{color:var(--warn)}.t.red .st{color:var(--bad)}
.ln{font-size:14px;color:#ccc;margin-top:7px;display:flex;gap:7px;align-items:baseline;line-height:1.3}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent;transform:translateY(-1px)}
.dot.green{background:var(--ok)}.dot.amber{background:var(--warn)}.dot.red{background:var(--bad)}.dot.gray{background:var(--gray)}
button{background:#222;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;margin-top:10px}
button:hover{background:#2c2c2c}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:9;overflow:auto}#ov.on{display:block}
#md{max-width:960px;margin:20px auto;background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:18px}
#mh{display:flex;justify-content:space-between;align-items:center}#mt{font-size:20px;font-weight:600}
#x{background:#222;border:0;color:#fff;font-size:20px;width:44px;height:44px;border-radius:22px;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid #1a1a1a;vertical-align:top}
th{color:var(--muted);font-weight:500}.kv td:first-child{color:var(--muted);width:35%}
footer{color:#555;font-size:12px;text-align:center;padding:10px 0 24px}
@media (max-width:640px){main{padding:12px;gap:10px}header{padding:14px 12px 8px}}
</style></head>
<body>
<header><div class="wm"><span id="ttl">Home</span><span class="sub" id="sub"></span></div><div id="clk"></div></header>
<main id="g"></main>
<footer id="ft">homehub</footer>
<div id="ov" onclick="if(event.target.id=='ov')cls()"><div id="md"><div id="mh"><div id="mt"></div><button id="x" onclick="cls()" aria-label="Close">×</button></div><div id="mb"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=[],open=null;
async function J(u,o){try{const r=await fetch(u,Object.assign({cache:'no-store',credentials:'same-origin'},o||{}));return await r.json()}catch(e){return null}}
function tileHTML(t){
  const ls=(t.lines||[]).map(l=>`<div class="ln"><span class="dot ${esc(l.level||'')}"></span><span>${esc(l.text)}</span></div>`).join('');
  const act=t.action?`<button onclick="event.stopPropagation();act('${esc(t.action.post)}')">${esc(t.action.label)}</button>`:'';
  return `<div class="t ${esc(t.level)}" onclick="openD('${esc(t.id)}')"><div class="th"><span class="tn">${esc(t.title)}</span><span class="st">${esc(t.status||'')}</span></div>${ls}${act}</div>`}
function render(){$('g').innerHTML=T.map(tileHTML).join('')||'<p style="color:#8a8a8a">No modules enabled. Edit config.json.</p>';if(open)detail()}
function val(v){if(v===null||v===undefined)return'—';if(typeof v=='object')return esc(JSON.stringify(v));return esc(v)}
function table(rows){if(!rows||!rows.length)return'';const ks=Object.keys(rows[0]).filter(k=>typeof rows[0][k]!='object'||rows[0][k]===null);
  return `<table><tr>${ks.map(k=>`<th>${esc(k)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${ks.map(k=>`<td>${val(r[k])}</td>`).join('')}</tr>`).join('')}</table>`}
function detailHTML(d){let h='';if(!d)return'<p style="color:#8a8a8a">No details.</p>';
  if(d.kv)h+=`<table class="kv">${d.kv.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${val(v)}</td></tr>`).join('')}</table>`;
  for(const [k,v] of Object.entries(d)){if(k=='kv')continue;
    if(Array.isArray(v)&&v.length&&typeof v[0]=='object')h+=`<h3>${esc(k)}</h3>`+table(v);
    else if(v&&typeof v=='object'&&!Array.isArray(v))h+=`<h3>${esc(k)}</h3><table class="kv">${Object.entries(v).map(([a,b])=>`<tr><td>${esc(a)}</td><td>${val(b)}</td></tr>`).join('')}</table>`;
    else if(!Array.isArray(v))h+=`<p><span style="color:#8a8a8a">${esc(k)}:</span> ${val(v)}</p>`}
  return h}
function detail(){const t=T.find(x=>x.id==open);if(!t)return cls();$('mt').textContent=t.title;$('mb').innerHTML=detailHTML(t.detail)}
function openD(id){open=id;detail();$('ov').classList.add('on')}
function cls(){open=null;$('ov').classList.remove('on')}
async function act(u){const r=await J(u,{method:'POST'});if(r&&r.error)alert(r.error);await load()}
async function load(){const r=await J('/api/tiles');if(r){T=r.tiles;render();$('ft').textContent='updated '+new Date(r.generated*1000).toLocaleTimeString()}}
async function init(){const m=await J('/api/modules');if(m){$('ttl').textContent=m.site.title;$('sub').textContent=m.site.subtitle||'';document.title=m.site.title}
  await load();setInterval(load,10000)}
setInterval(()=>{$('clk').textContent=new Date().toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})},1000);
document.addEventListener('keydown',e=>{if(e.key=='Escape')cls()});
init();
</script>
</body></html>
